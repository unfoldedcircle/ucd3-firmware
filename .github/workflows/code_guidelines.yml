# GitHub Action that verifies C++ source compliance with clang-format

name: Code Guidelines
on:
  push:
    paths:
      - .github/workflows/code_guidelines.yml
      - .clang-format*
      - components/**.c*
      - components/**.h
      - main/**.c*
      - main/**.h
  pull_request:
    paths:
      - .github/workflows/code_guidelines.yml
      - .clang-format*
      - components/**.c*
      - components/**.h
      - main/**.c*
      - main/**.h

jobs:
  clang-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python -m pip install clang-format==20.1.8
      - name: clang-format
        run: |
          ./code_style.sh --check
