# GitHub Action that verifies C++ source compliance with clang-format

name: Code Guidelines
on:
  push:
    paths:
      - .github/workflows/code_guidelines.yml
      - .clang-format*
      - components/**.c*
      - components/**.h
      - main/**.c*
      - main/**.h
  pull_request:
    paths:
      - .github/workflows/code_guidelines.yml
      - .clang-format*
      - components/**.c*
      - components/**.h
      - main/**.c*
      - main/**.h

jobs:
  clang-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - run: python -m pip install clang-format==20.1.8
      - name: clang-format
        run: |
          ./code_style.sh --check
