collect:
  - $cwd/webroot

filter:
  "**/.DS_Store":
    - discard
  "**/*.bak":
    - discard
  "**/lang":
    - discard
  "**/*.md":
    - discard

  "webroot/app.js":
    - uglify-js
    - gzip -9 -f -c

  # uglify-js doesn't work with the generated lang.js, so we just gzip it
  "webroot/lang.js":
    - gzip -9 -f -c

  "**/*.css":
    - uglifycss
    - gzip -9 -f -c

  "**/*.html":
    - html-minifier
    - gzip -9 -f -c

  "**/*.ico":
    - gzip -9 -f -c
  "**/*.svg":
    - gzip -9 -f -c
